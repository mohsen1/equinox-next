server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ready\n";
  }

  location = /api/internal/seed {
    proxy_pass http://orchestrator:8080/internal/seed;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 360s;
  }

  location /api/v1/ {
    proxy_pass http://orchestrator:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 360s;
  }

  location /api/internal/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
